<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>zoomsync-rclone: политика конфиденциальности</title></head><body><h1>Политика конфиденциальности zoomsync-rclone</h1><p>Приложение использует доступ только к Google Диску своего владельца, чтобы копировать его собственные файлы. Данные не передаются третьим лицам, не продаются и не используются для рекламы. Приложение не собирает данные других людей.</p></body></html>
